spring.application.name=lynkster-backend
spring.output.ansi.enabled=ALWAYS

# API
server.servlet.context-path=/api/v1

# DATABASE PostgresSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_URL_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
auth.token.jwtSecret=${JWT_SECRET}
auth.token.accessExpirationInMils=900000

# Brevo SMTP Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Verification Configuration
app.email.verification.resend-cooldown-seconds=120
app.email.verification.token-expiration-minutes=15


# Sender Email
app.mail.from=${MAIL_FROM}

# Frontend URL for verification links
app.frontend.url=${FRONTEND_URL}